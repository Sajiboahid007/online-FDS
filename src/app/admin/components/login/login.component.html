<div class="login-container" *ngIf="loginForm">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Enter your credentials</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div [formGroup]="loginForm" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input formControlName="Email" matInput type="email" placeholder="Enter your email" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error>Please enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            formControlName="Password"
            matInput
            type="password"
            placeholder="Enter your password"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <mat-error>Password is required</mat-error>
        </mat-form-field>
      </div>
    </mat-card-content>

    <mat-card-actions align="end">
      <button type="button" class="btn btn-danger">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="onLogin()" [disabled]="loginInProgress">
        {{ loginInProgress ? 'Logging in...' : 'Login' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
