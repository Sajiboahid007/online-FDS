<div class="form-container">
  <div class="form-header">
    <h4 class="form-title">
      {{ isEditMode ? 'Add Category' : 'Edit Category' }}
    </h4>
  </div>

  <form [formGroup]="categoryform" class="form-content">
    <div class="field-group">
      <p-floatlabel variant="on">
        <input
          id="category-name"
          pInputText
          class="full-width"
          formControlName="Name"
          type="text"
          autocomplete="off"
        />
        <label for="category-name">Category Name</label>
      </p-floatlabel>
      <p-message
        *ngIf="categoryform.get('Name')?.invalid && categoryform.get('Name')?.touched"
        severity="error"
        size="small"
        variant="simple"
        text="Please enter a valid category name"
      ></p-message>
    </div>

    <div class="field-group">
      <label>Status</label>

      <p-toggleswitch formControlName="Status" />

      <span class="status-label">{{
        categoryform.get('Status')?.value ? 'Active' : 'Inactive'
      }}</span>

      <!-- <p-selectButton
        [options]="statusOptions"
        formControlName="Status"
        optionLabel="label"
        optionValue="value"
      ></p-selectButton> -->
    </div>
  </form>

  <div class="form-actions">
    <p-button
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      (onClick)="onCancel()"
    ></p-button>
    <p-button
      label="{{ isEditMode ? 'Update' : 'Save' }}"
      severity="primary"
      [outlined]="true"
      (onClick)="onSave()"
    ></p-button>
  </div>
</div>
