<h2 class="p-dialog-title m-0">{{ data.title }}</h2>
<div class="dialog-message py-3">{{ data.message }}</div>
<div class="flex justify-content-end gap-2">
  <p-button [label]="data.cancelText" severity="secondary" (onClick)="onCancel()"></p-button>
  <p-button [label]="data.confirmText" [severity]="data.confirmColor === 'warn' ? 'danger' : 'primary'" (onClick)="onConfirm()"></p-button>
</div>
